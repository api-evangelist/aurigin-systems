name: Aurigin Systems
description: Aurigin Systems, Inc. was an intellectual-property management software company founded in
  1992 and headquartered in Cupertino, California. It built online patent and trademark information
  services and business-automation software for intellectual-asset management, raising roughly $54M in
  venture funding (investors included Battery Ventures) over its lifetime. The company operated under
  Chapter 11 bankruptcy protection before substantially all of its assets were acquired by Information
  Holdings Inc. in May 2002. It is defunct, has no surviving website, developer portal, or public API,
  and was surfaced only as a historical portfolio lead from a Battery Ventures scrape.
